# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate-wir-v2:
    name: apply reviewed WIR v2 migration
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/audit-bootstrap-chain'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply migration
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            python3 scripts/migrate_wir_v2.py
            rm -f src/string_utils.wir
            rm -f scripts/migrate_wir_v2.py
            rm -f migration.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "bootstrap: migrate frontend and goldens to WIR v2"
            git push origin HEAD:${GITHUB_HEAD_REF}
          } 2>&1 | tee migration.log

      - name: Upload failed migration log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-diagnostics-${{ github.run_id }}
          path: migration.log
          if-no-files-found: error
          retention-days: 7

  test:
    name: build & test (${{ matrix.name }})
    needs: migrate-wir-v2
    if: >-
      always() &&
      (needs.migrate-wir-v2.result == 'success' ||
       needs.migrate-wir-v2.result == 'skipped')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-glibc-sdk
            os: ubuntu-latest
            libc: glibc
          - name: linux-musl-sdk
            os: ubuntu-latest
            libc: musl
          - name: macos-source-fallback
            os: macos-latest
            libc: glibc

    env:
      WEAVEC1_VERSION: v0.2.0
      WEAVEC1_TAG: v0.2.0
      WEAVEC1_LIBC: ${{ matrix.libc }}
      WEAVEC0_TAG: v0.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM and SDK tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            clang \
            curl \
            llvm \
            musl-tools
          clang --version
          llvm-as --version
          llvm-link --version
          musl-gcc --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Build weavec-bootstrap
        run: ./build.sh 2>&1 | tee build.log

      - name: Verify canonical artifacts
        run: |
          test -x build/weavec-bootstrap
          test -s build/weavec-bootstrap.bc
          test -s build/libweave-sexpr.bc
          test ! -e build/weavefront

      - name: Run weavec-bootstrap test ladder
        run: ./test_all.sh 2>&1 | tee test.log

      - name: Upload failed logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}-${{ github.run_id }}
          path: |
            build.log
            test.log
          if-no-files-found: warn
          retention-days: 7
