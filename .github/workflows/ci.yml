# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-glibc-sdk
            os: ubuntu-latest
            libc: glibc
          - name: linux-musl-sdk
            os: ubuntu-latest
            libc: musl
          - name: macos-source-fallback
            os: macos-latest
            libc: glibc

    env:
      WEAVEC1_VERSION: v0.2.0
      WEAVEC1_TAG: v0.2.0
      WEAVEC1_LIBC: ${{ matrix.libc }}
      WEAVEC0_TAG: v0.2.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LLVM and SDK tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            clang \
            curl \
            llvm \
            musl-tools
          clang --version
          llvm-as --version
          llvm-link --version
          musl-gcc --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Build weavec-bootstrap
        run: ./build.sh 2>&1 | tee build.log

      - name: Verify canonical artifacts
        run: |
          test -x build/weavec-bootstrap
          test -s build/weavec-bootstrap.bc
          test -s build/libweave-sexpr.bc
          test ! -e build/weavefront

      - name: Run weavec-bootstrap test ladder
        run: ./test_all.sh 2>&1 | tee test.log

      - name: Upload failed logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: |
            build.log
            test.log
          if-no-files-found: ignore
          retention-days: 7
