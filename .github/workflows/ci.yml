# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-glibc-sdk
            os: ubuntu-latest
            libc: glibc
          - name: linux-musl-sdk
            os: ubuntu-latest
            libc: musl
          - name: macos-sdk
            os: macos-latest
            libc: glibc

    env:
      WEAVEC1_VERSION: v0.3.2
      WEAVEC1_LIBC: ${{ matrix.libc }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documentation
        run: python3 scripts/check_docs.py

      - name: Audit frozen bootstrap boundaries
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/audit_bootstrap.py 2>&1 | tee audit.log

      - name: Install LLVM and SDK tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            clang \
            curl \
            file \
            llvm \
            musl-tools
          clang --version
          llvm-as --version
          llvm-link --version
          musl-gcc --version

      - name: Install LLVM toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          clang --version
          llvm-as --version
          llvm-link --version

      - name: Build weavec-bootstrap
        shell: bash
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee build.log

      - name: Verify canonical artifacts
        run: |
          test -x build/weavec-bootstrap
          test -s build/weavec-bootstrap.bc
          test ! -e build/libweave-sexpr.bc
          test ! -e build/weavefront

      - name: Run weavec-bootstrap test ladder
        shell: bash
        run: |
          set -o pipefail
          ./test_all.sh 2>&1 | tee test.log

      - name: Package Linux glibc SDK under review
        if: matrix.name == 'linux-glibc-sdk'
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          scripts/package-linux-sdk.sh glibc "$version" dist
          test -s "dist/weavec-bootstrap-${version}-linux-x86_64-glibc.tar.gz"

      - name: Upload Linux glibc SDK under review
        if: matrix.name == 'linux-glibc-sdk'
        uses: actions/upload-artifact@v4
        with:
          name: weavec-bootstrap-linux-glibc-sdk
          path: dist/weavec-bootstrap-v*-linux-x86_64-glibc.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload failed diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.name }}-${{ github.run_id }}
          path: |
            audit.log
            build.log
            test.log
            build/audit/*.json
          if-no-files-found: warn
          retention-days: 7

  downstream-weavec:
    name: downstream weavec full ladder
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WEAVEC1_VERSION: v0.3.2
      WEAVEC1_LIBC: glibc
      WEAVEC_BOOTSTRAP_SDK: ${{ github.workspace }}/bootstrap-sdk

    steps:
      - name: Checkout downstream weavec
        uses: actions/checkout@v4
        with:
          # Keep the current compiler, not a frozen tag. This seed must still
          # bootstrap weavec's default branch; a published SDK pin would not
          # test the frontend under review.
          repository: ahojukka5/weavec
          path: downstream/weavec

      - name: Download bootstrap SDK under review
        uses: actions/download-artifact@v4
        with:
          name: weavec-bootstrap-linux-glibc-sdk
          path: dist

      - name: Install downstream toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang curl git llvm python3
          for tool in llvm-as llvm-link llc; do
            if command -v "$tool" >/dev/null 2>&1; then
              continue
            fi
            versioned="$(command -v "${tool}-18" || command -v "${tool}-17" || true)"
            [[ -n "$versioned" ]] || {
              echo "missing $tool" >&2
              exit 1
            }
            sudo ln -sf "$versioned" "/usr/local/bin/$tool"
          done
          clang --version
          llvm-as --version
          llvm-link --version
          llc --version | head -2
          python3 --version
          mkdir -p bootstrap-sdk
          archive="$(echo dist/weavec-bootstrap-v*-linux-x86_64-glibc.tar.gz)"
          tar -xzf "$archive" --strip-components=1 -C bootstrap-sdk
          test -x bootstrap-sdk/bin/weavec-bootstrap
          test -x bootstrap-sdk/bin/weavec-bootstrap-cat
          test -f bootstrap-sdk/bin/extract_program_decls.py
          test ! -e bootstrap-sdk/lib/libweave-sexpr.bc

      - name: Build and test downstream weavec
        shell: bash
        run: |
          set -o pipefail
          (
            cd downstream/weavec
            ./test-all.sh
          ) 2>&1 | tee downstream-weavec.log
          grep -F 'using WEAVEC_BOOTSTRAP_SDK:' downstream-weavec.log
          if grep -E 'downloading weavec-bootstrap SDK' downstream-weavec.log; then
            echo "downstream weavec downloaded a published bootstrap SDK" >&2
            exit 1
          fi

      - name: Verify WIR v2 bootstrap product
        run: |
          test -x downstream/weavec/build/weavec
          test -s downstream/weavec/build/weavec.wir
          grep -F "(core-version 2)" downstream/weavec/build/weavec.wir

      - name: Upload failed downstream diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-weavec-${{ github.run_id }}
          path: |
            downstream-weavec.log
            downstream/weavec/build/*.wir
            downstream/weavec/build/*.ll
          if-no-files-found: warn
          retention-days: 7
