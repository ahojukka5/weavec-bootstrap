# SPDX-License-Identifier: Apache-2.0
name: migrate-wir-v2

on:
  push:
    branches: [agent/audit-bootstrap-chain]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-bootstrap-chain

      - name: Apply reviewed migration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/migrate_wir_v2.py
          rm -f src/string_utils.wir
          rm -f scripts/migrate_wir_v2.py
          rm -f .github/workflows/migrate-wir-v2.yml

      - name: Commit migrated sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "bootstrap: migrate frontend and goldens to WIR v2"
          git push origin HEAD:agent/audit-bootstrap-chain
