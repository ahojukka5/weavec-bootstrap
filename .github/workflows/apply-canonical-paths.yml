name: Apply canonical bootstrap paths

on:
  push:
    branches:
      - refactor/canonical-paths

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-paths
          fetch-depth: 0

      - name: Rename bootstrap interfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old_script = Path("weavefront-cat.sh")
          new_script = Path("weavec-bootstrap-cat.sh")
          old_script.rename(new_script)

          paths = [
              Path("build.sh"),
              Path("test.sh"),
              Path("test_all.sh"),
              Path(".github/workflows/ci.yml"),
              Path("src/main.wir"),
              Path("README.md"),
              Path("CONTRIBUTING.md"),
              Path("CHANGELOG.md"),
              Path("NOTICE"),
              Path("docs/ARCHITECTURE.md"),
              new_script,
          ]
          for path in paths:
              text = path.read_text()
              text = text.replace("WEAVEFRONT", "WEAVEC_BOOTSTRAP")
              text = text.replace("Weavefront", "Weavec-bootstrap")
              text = text.replace("weavefront", "weavec-bootstrap")
              path.write_text(text)

          main = Path("src/main.wir")
          text = main.read_text()
          text = text.replace("(const_i64 45)", "(const_i64 51)", 1)
          text = text.replace("(const_i64 31)", "(const_i64 37)", 1)
          main.write_text(text)

          build = Path("build.sh")
          text = build.read_text()
          text = text.replace(
              'TOOLCHAIN_ENV="$BUILD_DIR/toolchain.env"\n',
              'TOOLCHAIN_ENV="$BUILD_DIR/toolchain.env"\n'
              'SEXPR_LIBRARY="$BUILD_DIR/libweave-sexpr.bc"\n',
          )
          anchor = "link_and_compile() {\n"
          function = "\n".join((
              "build_sexpr_library() {",
              '  log "linking reusable S-expression parser library"',
              "  llvm-link \\",
              '    "$BUILD_DIR/sexpr_tokens.ll" \\',
              '    "$BUILD_DIR/sexpr_tree.ll" \\',
              '    "$BUILD_DIR/sexpr_lexer.ll" \\',
              '    "$BUILD_DIR/sexpr_parser.ll" \\',
              '    -o "$SEXPR_LIBRARY" \\',
              '    || fail "failed to link $SEXPR_LIBRARY"',
              '  [[ -s "$SEXPR_LIBRARY" ]] || fail "empty S-expression parser library"',
              "}",
              "",
          )) + "\n"
          if function not in text:
              text = text.replace(anchor, function + anchor, 1)
          text = text.replace(
              '  compile_modules\n  link_and_compile\n',
              '  compile_modules\n  build_sexpr_library\n  link_and_compile\n',
          )
          build.write_text(text)

          readme = Path("README.md")
          text = readme.read_text()
          text = text.replace(
              "The current executable retains the historical path `build/weavec-bootstrap` for\n"
              "compatibility. Conceptually it is the `weavec-bootstrap` command:\n\n"
              "```bash\n"
              "./build/weavec-bootstrap test/01_return_42.weave /tmp/out.wir\n"
              "```\n",
              "The built command is:\n\n"
              "```bash\n"
              "./build/weavec-bootstrap test/01_return_42.weave /tmp/out.wir\n"
              "```\n",
          )
          text = text.replace(
              "3. combines the LLVM modules into `build/weavec-bootstrap.bc`;\n"
              "4. links the executable with the matching runtime;\n"
              "5. writes `build/toolchain.env` for tests and downstream bootstrap use.\n\n"
              "The `build/weavec-bootstrap*` filenames are compatibility names from the former\n"
              "repository identity. New documentation refers to the component as\n"
              "`weavec-bootstrap`.\n",
              "3. links `sexpr_tokens`, `sexpr_tree`, `sexpr_lexer`, and `sexpr_parser`\n"
              "   into the reusable `build/libweave-sexpr.bc` bootstrap library;\n"
              "4. combines all frontend modules into `build/weavec-bootstrap.bc`;\n"
              "5. links the `build/weavec-bootstrap` executable with the matching runtime;\n"
              "6. writes `build/toolchain.env` for tests and downstream bootstrap use.\n",
          )
          text = text.replace(
              "├── weavec-bootstrap-cat.sh          historical multifile script name\n",
              "├── weavec-bootstrap-cat.sh      multifile bootstrap driver\n",
          )
          text = text.replace(
              "The historical `weavec-bootstrap-cat.sh` script combines multiple `(program ...)`\n",
              "`weavec-bootstrap-cat.sh` combines multiple `(program ...)`\n",
          )
          text = text.replace(
              "- Executable and helper filenames still contain the historical `weavec-bootstrap`\n"
              "  name for compatibility.\n",
              "",
          )
          readme.write_text(text)

          architecture = Path("docs/ARCHITECTURE.md")
          text = architecture.read_text()
          marker = "## Multifile bootstrap path\n"
          library_section = (
              "## Reusable parser library\n\n"
              "The WIR modules `sexpr_tokens`, `sexpr_tree`, `sexpr_lexer`, and\n"
              "`sexpr_parser` form a reusable bootstrap support library. `build.sh` links\n"
              "them into `build/libweave-sexpr.bc`. Downstream compiler stages consume that\n"
              "single named library instead of reaching into this repository for four\n"
              "unstructured build products. The sources remain here because they implement\n"
              "the parser used by the bootstrap frontend.\n\n"
          )
          if library_section not in text:
              text = text.replace(marker, library_section + marker, 1)
          architecture.write_text(text)

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "## [Unreleased]\n"
          entry = (
              "\n### Changed\n\n"
              "- Renamed the executable to `build/weavec-bootstrap` and the multifile\n"
              "  driver to `weavec-bootstrap-cat.sh`; the former compatibility names were\n"
              "  removed.\n"
              "- Linked the four reusable S-expression parser modules into the named\n"
              "  `build/libweave-sexpr.bc` bootstrap library for downstream consumers.\n"
          )
          if entry not in text:
              text = text.replace(marker, marker + entry, 1)
          changelog.write_text(text)

          Path(".github/workflows/apply-canonical-paths.yml").unlink()
          PY

      - name: Validate refactor
        shell: bash
        run: |
          bash -n build.sh
          bash -n weavec-bootstrap-cat.sh
          bash -n test.sh
          bash -n test_all.sh
          git diff --check
          ! grep -R --exclude=CHANGELOG.md --exclude=NOTICE --exclude-dir=.git -n 'weavefront' .

      - name: Commit canonical paths
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor: use canonical bootstrap names and parser library"
          git push origin HEAD:refactor/canonical-paths
